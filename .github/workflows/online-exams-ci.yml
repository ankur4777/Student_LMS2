name: Student LMS online exam checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/mixed-online-exams]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: exam-ci-pass
          MYSQL_DATABASE: student_lms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pexam-ci-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: student_lms
      DB_USER: root
      DB_PASSWORD: exam-ci-pass
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DJANGO_SECRET_KEY: ci-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend packages
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Check migration definitions
        run: python manage.py makemigrations --check --dry-run
      - name: Run existing and new exam regression tests
        run: python manage.py test studentresults.test_online_exams studentresults.tests --noinput

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci
      - name: Build Next.js
        working-directory: frontend
        run: npm run build
